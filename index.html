<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Drill 2</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://pyscript.net/releases/2024.11.1/core.css">
    <script type="module"
            src="https://pyscript.net/releases/2024.11.1/core.js"></script>

    <style>
        :root {
            --bg: #eaf2fb;
            --card: #ffffff;
            --text: #2c3e50;
            --muted: #6b7f95;
            --blue: #4a7fb5;
            --blue-dark: #3b6ea5;
            --border: #d3e2f2;
            --result-bg: #f1f6fc;
            --result-text: #2c4a6b;
            --highlight: #dcebfa;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: "Inter", system-ui, -apple-system, "Segoe UI",
                         Roboto, sans-serif;
        }

        .page-box {
            max-width: 640px;
        }

        .card-panel {
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 28px;
            box-shadow: 0 4px 18px rgba(74, 127, 181, 0.10);
        }

        h1 {
            color: var(--blue-dark);
            font-weight: 600;
        }

        .subtitle {
            color: var(--muted);
            font-size: 0.9rem;
        }

        .form-control {
            border-color: var(--border);
            border-radius: 8px;
            padding: 10px 12px;
        }

        .form-control:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 0.2rem rgba(74, 127, 181, 0.18);
        }

        .btn-blue {
            background-color: var(--blue);
            border-color: var(--blue);
            color: #ffffff;
            border-radius: 8px;
            padding: 8px 22px;
            font-weight: 500;
        }

        .btn-blue:hover {
            background-color: var(--blue-dark);
            border-color: var(--blue-dark);
            color: #ffffff;
        }

        #output {
            background-color: var(--result-bg);
            color: var(--result-text);
            border: 1px solid var(--border);
            border-left: 4px solid var(--blue);
            border-radius: 8px;
            padding: 16px 20px;
            font-size: 0.95rem;
            line-height: 1.7;
        }

        .members-title {
            display: inline-block;
            background-color: var(--highlight);
            color: var(--blue-dark);
            font-weight: 700;
            font-size: 1.05rem;
            padding: 2px 10px;
            border-radius: 6px;
            margin-bottom: 6px;
        }

        .members-total {
            display: inline-block;
            background-color: var(--highlight);
            color: var(--blue-dark);
            font-weight: 700;
            font-size: 1.05rem;
            padding: 2px 10px;
            border-radius: 6px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container page-box py-5">

        <div class="card-panel mb-4">
            <h1 class="h4 mb-1">ICT Club Members (REAL)</h1>
            <p class="subtitle mb-4">Got a new member? This webpage has got you handled.</p>

            <label class="form-label fw-semibold">Add NEW club member:</label>

            <input type="text" id="first-name" class="form-control mb-2"
                   placeholder="First name (e.g. John)">

            <input type="text" id="last-name" class="form-control mb-3"
                   placeholder="Last name (e.g. Python)">

            <button type="button" id="submit-btn" class="btn btn-blue">
                Submit
            </button>
        </div>

        <div class="card-panel">
            <div id="output"></div>
        </div>
    </div>

    <script type="py">
import html

from pyscript import document, when

grade_7 = {"Gray Seffen", "Monte Sory", "Pai Tonne", "Ja Vaskrip"}
grade_8 = {"Vies Cod", "Ei C.T.", "Obi Emsi", "C.S. Ess"}
grade_9 = {"John Computer", "Gray Naine", "Cody Ng", "Setto Peratures"}
grade_10 = {"Geet Hobb", "Eich Tiemel"}

members = grade_7 | grade_8 | grade_9 | grade_10


def show_results():
    """Write the full member list and the total count into the page."""
    full_list = "<br>".join(sorted(members))
    document.querySelector("#output").innerHTML = (
        f"<div class='members-title'>All members:</div><br>"
        f"{full_list}<br>"
        f"<div class='members-total'>Total members: {len(members)}</div>"
    )


@when("click", "#submit-btn")
def add_member(event):
    """Add the typed name to the master set, then update the results."""
    global members

    first = document.querySelector("#first-name")
    last = document.querySelector("#last-name")
    full_name = f"{first.value.strip()} {last.value.strip()}".strip()
    new_member = html.escape(full_name)

    members = members | ({new_member} - {""})

    first.value = ""
    last.value = ""

    show_results()


show_results()
    </script>
</body>
</html>
